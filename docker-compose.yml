services:
  crossword-backend:
    build: ./backend
    depends_on:
      - crossword-db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@crossword-db:5432/${POSTGRES_DB}
      # Twitch chat (read anonymously); overridable to test against a fake IRC server
      - TWITCH_IRC_URL=${TWITCH_IRC_URL:-wss://irc-ws.chat.twitch.tv:443}
    ports:
      - 8000:8000
    # Mount source for development so backend code changes are picked up
    # (:z relabels the mounts for SELinux hosts such as Fedora)
    volumes:
      - ./backend/src:/app/src:z
      - ./backend/pyproject.toml:/app/pyproject.toml:ro,z

  crossword-frontend:
    build: ./frontend
    ports:
      - 5173:5173
    environment:
      - VITE_BACKEND_ORIGIN=crossword-backend:8000
    depends_on:
      - crossword-backend
    # Mount frontend source so Vite HMR works without rebuilding the image
    volumes:
      - ./frontend/src:/app/src:z
      - ./frontend/index.html:/app/index.html:ro,z
      - ./frontend/vite.config.js:/app/vite.config.js:ro,z

  crossword-db:
    # Pin to Postgres 17 to match the existing data directory and allow a safe
    # restore/migration. Use `postgres:latest` only after running a proper
    # major-version upgrade (pg_upgrade) or restoring from a dump.
    image: postgres:17
    env_file:
      - .env
    volumes:
      - crossword-db-data:/var/lib/postgresql/data
      # Only runs when the data volume is empty (first start)
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    ports:
      - 5432:5432

networks:
  default:
    name: crossword-net
    driver: bridge

volumes:
  crossword-db-data: